trigger:
- main

pr:
- main

pool:
  vmImage: ubuntu-latest

variables:
  - group: idp          # Library variable group (GITHUB_USERNAME, GITHUB_PAT)
  - name: acrName
    value: 'idpflowacr1'
  - name: imageName
    value: 'idpflow-service'
  - name: dockerfilePath
    value: 'Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

stages:

# =========================================
# STAGE 0 - DETECT CHANGES
# =========================================
- stage: DetectChanges
  displayName: "Detect Service Changes"

  jobs:
  - job: Detect
    displayName: "Detect Changed Services"

    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        set -e

        # Resolve base commit: use PR target branch or previous commit
        if [ "$(Build.Reason)" = "PullRequest" ]; then
          BASE=$(git merge-base HEAD origin/$(System.PullRequest.TargetBranch))
        else
          BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
        fi

        if [ -z "$BASE" ]; then
          CHANGED=""
          echo "No base commit found — full pipeline will run"
        else
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "${CHANGED:-  (none)}"
        fi

        # Set isOutput variable to true if the given path prefix is in CHANGED
        flag() {
          local path="$1" var="$2"
          if echo "$CHANGED" | grep -q "^$path"; then
            echo "##vso[task.setvariable variable=${var};isOutput=true]true"
            echo "  CHANGED: $path"
          else
            echo "##vso[task.setvariable variable=${var};isOutput=true]false"
          fi
        }

        flag "agentcore/src/backend"                     "backend_changed"
        flag "agentcore/src/frontend"                    "frontend_changed"
        flag "agentcore/src/services/model-service"      "model_changed"

        # full_pipeline=true when CHANGED is empty OR no service directory was touched
        SVC_HIT=$(echo "$CHANGED" | grep -E "^agentcore/src/(backend|frontend|services)/" || true)
        if [ -z "$CHANGED" ] || [ -z "$SVC_HIT" ]; then
          echo "##vso[task.setvariable variable=full_pipeline;isOutput=true]true"
          echo "No service changes detected — full pipeline will run"
        else
          echo "##vso[task.setvariable variable=full_pipeline;isOutput=true]false"
          echo "Selective build: only changed services will run"
        fi
      name: detect
      displayName: "Detect Changed Services"

# =========================================
# STAGE 1 - TERRAFORM CI
# =========================================
- stage: TerraformCI
  displayName: "Terraform Validation"

  dependsOn: DetectChanges

  jobs:
  - job: ValidateTerraform
    displayName: "Validate Terraform"

    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: 'idp-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          cd infra/dev
          terraform init

    - script: |
        cd infra/dev
        terraform fmt -check
      displayName: "Terraform Format"

    - task: AzureCLI@2
      displayName: "Terraform Validate"
      inputs:
        azureSubscription: 'idp-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          cd infra/dev
          terraform validate

    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: 'idp-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          cd infra/dev
          terraform plan

# =========================================
# STAGE 2 - TERRAFORM DEPLOY
# =========================================
- stage: TerraformDeploy
  displayName: "Deploy Infrastructure"

  dependsOn: TerraformCI

  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  jobs:
  - job: DeployInfra
    displayName: "Terraform Apply"

    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: 'idp-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          cd infra/dev
          terraform init

    - task: AzureCLI@2
      displayName: "Terraform Apply"
      inputs:
        azureSubscription: 'idp-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          cd infra/dev
          terraform apply -auto-approve

# =========================================
# STAGE 3 - BUILD & PUSH DOCKER IMAGES
# =========================================
- stage: BuildAndPush
  displayName: "Build and Push Docker Images"

  dependsOn:
  - TerraformDeploy
  - DetectChanges

  condition: succeeded()

  # Map DetectChanges outputs to stage-scoped variables for use in step conditions
  variables:
    full_pipeline:      $[ stageDependencies.DetectChanges.Detect.outputs['detect.full_pipeline'] ]
    backend_changed:    $[ stageDependencies.DetectChanges.Detect.outputs['detect.backend_changed'] ]
    frontend_changed:   $[ stageDependencies.DetectChanges.Detect.outputs['detect.frontend_changed'] ]
    model_changed:      $[ stageDependencies.DetectChanges.Detect.outputs['detect.model_changed'] ]

  jobs:
  - job: DockerBuildPush
    displayName: "Docker Build & Push"

    steps:

    # ACR LOGIN — always runs
    - task: AzureCLI@2
      displayName: "ACR Login"
      inputs:
        azureSubscription: 'idp-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name idpflowacr1

    # =====================================
    # BACKEND SERVICE
    # =====================================
    - script: |
        docker build \
        -f agentcore/src/backend/Dockerfile \
        -t idpflowacr1.azurecr.io/backend:$(Build.BuildId) \
        agentcore/src/backend
      displayName: "Build Backend"
      condition: or(eq(variables['backend_changed'], 'true'), eq(variables['full_pipeline'], 'true'))

    - script: |
        docker push idpflowacr1.azurecr.io/backend:$(Build.BuildId)
      displayName: "Push Backend"
      condition: or(eq(variables['backend_changed'], 'true'), eq(variables['full_pipeline'], 'true'))

    # =====================================
    # FRONTEND SERVICE
    # =====================================
    - script: |
        docker build \
        -f agentcore/src/frontend/Dockerfile \
        -t idpflowacr1.azurecr.io/frontend:$(Build.BuildId) \
        agentcore/src/frontend
      displayName: "Build Frontend"
      condition: or(eq(variables['frontend_changed'], 'true'), eq(variables['full_pipeline'], 'true'))

    - script: |
        docker push idpflowacr1.azurecr.io/frontend:$(Build.BuildId)
      displayName: "Push Frontend"
      condition: or(eq(variables['frontend_changed'], 'true'), eq(variables['full_pipeline'], 'true'))

    # =====================================
    # MODEL SERVICE
    # =====================================
    - script: |
        docker build \
        -f agentcore/src/services/model-service/Dockerfile \
        -t idpflowacr1.azurecr.io/model-service:$(Build.BuildId) \
        agentcore/src/services/model-service
      displayName: "Build Model Service"
      condition: or(eq(variables['model_changed'], 'true'), eq(variables['full_pipeline'], 'true'))

    - script: |
        docker push idpflowacr1.azurecr.io/model-service:$(Build.BuildId)
      displayName: "Push Model Service"
      condition: or(eq(variables['model_changed'], 'true'), eq(variables['full_pipeline'], 'true'))

# =========================================
# STAGE 4 - BOOTSTRAP AKS (first time only)
# =========================================
# Required Azure DevOps pipeline variables (mark as secret):
#   GITHUB_USERNAME   - your GitHub username
#   GITHUB_PAT        - GitHub Personal Access Token (repo read access)
# =========================================
- stage: ArgocdBootstrap
  displayName: "Bootstrap AKS: nginx + ArgoCD + Secrets"
  dependsOn: BuildAndPush
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  jobs:
  - job: Bootstrap
    displayName: "Install nginx, ArgoCD, secrets"
    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: "Get AKS credentials"
      inputs:
        azureSubscription: 'idp-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials \
            --resource-group idpflow-rg \
            --name idpflow-aks \
            --overwrite-existing

    - script: |
        if ! helm repo list | grep -q ingress-nginx; then
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
        fi
        if ! helm status ingress-nginx -n ingress-nginx &>/dev/null; then
          helm install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --wait
          echo "nginx ingress controller installed."
        else
          echo "nginx ingress already installed, skipping."
        fi
      displayName: "Install nginx Ingress Controller"

    - script: |
        if ! kubectl get namespace argocd &>/dev/null; then
          kubectl create namespace argocd
          kubectl apply -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          echo "ArgoCD installed — waiting for pods to be ready..."
          kubectl wait --for=condition=available deployment/argocd-server \
            -n argocd --timeout=180s
        else
          echo "ArgoCD already installed, skipping."
        fi
      displayName: "Install ArgoCD"

    - task: AzureCLI@2
      displayName: "Create Kubernetes secrets from Key Vault"
      inputs:
        azureSubscription: 'idp-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          kubectl create namespace idpflow --dry-run=client -o yaml | kubectl apply -f -

          POSTGRES_PWD=$(az keyvault secret show \
            --vault-name idpflow-kv-dev-001 \
            --name postgres-password \
            --query value -o tsv)

          REDIS_KEY=$(az managed-redis list-keys \
            --name idpflow-redis-dev \
            --resource-group idpflow-rg \
            --query primaryKey -o tsv)

          STORAGE_KEY=$(az storage account keys list \
            --account-name idpflowappstore1 \
            --resource-group idpflow-rg \
            --query "[0].value" -o tsv)

          SMTP_PWD=$(az keyvault secret show \
            --vault-name idpflow-kv-dev-001 \
            --name smtp-password \
            --query value -o tsv)

          DB_URL="postgresql+psycopg2://pgadmin:${POSTGRES_PWD}@idpflow-postgres.postgres.database.azure.com:5432/idp_agentic?sslmode=require"

          kubectl create secret generic app-secrets \
            --namespace idpflow \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PWD" \
            --from-literal=REDIS_PASSWORD="$REDIS_KEY" \
            --from-literal=STORAGE_ACCOUNT_KEY="$STORAGE_KEY" \
            --from-literal=DATABASE_URL="$DB_URL" \
            --from-literal=SMTP_PASSWORD="$SMTP_PWD" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Kubernetes secrets applied."

    - script: |
        # Register GitHub repo with ArgoCD (skipped if already registered)
        REPO_URL="https://github.com/$(GITHUB_USERNAME)/$(Build.Repository.Name).git"
        if ! kubectl get secret -n argocd -l "argocd.argoproj.io/secret-type=repository" \
            -o jsonpath='{.items[*].data.url}' | base64 -d 2>/dev/null | grep -q "$REPO_URL"; then
          kubectl create secret generic argocd-repo-github \
            --namespace argocd \
            --from-literal=type=git \
            --from-literal=url="$REPO_URL" \
            --from-literal=username="$(GITHUB_USERNAME)" \
            --from-literal=password="$(GITHUB_PAT)" \
            --dry-run=client -o yaml \
          | kubectl label --local -f - "argocd.argoproj.io/secret-type=repository" --dry-run=client -o yaml \
          | kubectl apply -f -
          echo "ArgoCD repo credentials registered."
        else
          echo "ArgoCD repo already registered, skipping."
        fi
      displayName: "Register GitHub repo with ArgoCD"

    - script: |
        kubectl apply -f manifests/argocd/argocd-app.yaml
      displayName: "Apply ArgoCD Application"

# =========================================
# STAGE 5 - UPDATE IMAGE TAGS IN MANIFESTS
# =========================================
- stage: UpdateManifests
  displayName: "Update Image Tags & Trigger ArgoCD Sync"
  dependsOn:
  - BuildAndPush
  - DetectChanges
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  variables:
    full_pipeline:   $[ stageDependencies.DetectChanges.Detect.outputs['detect.full_pipeline'] ]
    backend_changed: $[ stageDependencies.DetectChanges.Detect.outputs['detect.backend_changed'] ]
    frontend_changed: $[ stageDependencies.DetectChanges.Detect.outputs['detect.frontend_changed'] ]
    model_changed:   $[ stageDependencies.DetectChanges.Detect.outputs['detect.model_changed'] ]

  jobs:
  - job: PatchManifests
    displayName: "Patch deployment image tags"
    steps:

    - checkout: self
      persistCredentials: true

    - script: |
        git config user.email "ado-pipeline@idpflow.dev"
        git config user.name "ADO Pipeline"
      displayName: "Configure git"

    - script: |
        TAG=$(Build.BuildId)

        patch_image() {
          local file="$1" image="$2"
          sed -i "s|image: ${image}:.*|image: ${image}:${TAG}|g" "$file"
        }

        if [ "$(backend_changed)" = "true" ] || [ "$(full_pipeline)" = "true" ]; then
          patch_image manifests/dev/deployments/backend-deployment.yaml \
            idpflowacr1.azurecr.io/backend
          echo "Patched backend → :${TAG}"
        fi

        if [ "$(frontend_changed)" = "true" ] || [ "$(full_pipeline)" = "true" ]; then
          patch_image manifests/dev/deployments/frontend-deployment.yaml \
            idpflowacr1.azurecr.io/frontend
          echo "Patched frontend → :${TAG}"
        fi

        if [ "$(model_changed)" = "true" ] || [ "$(full_pipeline)" = "true" ]; then
          patch_image manifests/dev/deployments/model-service-deployment.yaml \
            idpflowacr1.azurecr.io/model-service
          echo "Patched model-service → :${TAG}"
        fi
      displayName: "Patch image tags in manifests"

    - script: |
        git add manifests/dev/deployments/
        git diff --cached --quiet && echo "No manifest changes, skipping commit." && exit 0
        git commit -m "ci: update image tags to build $(Build.BuildId) [skip ci]"
        git push origin HEAD:main
      displayName: "Commit and push manifest changes"

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires -1;
  }

  location = /health {
    proxy_pass http://agentflow-backend:7860/health;
    proxy_set_header Host agentflow-backend;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health_check {
    proxy_pass http://agentflow-backend:7860/health;
    proxy_set_header Host agentflow-backend;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_http_version 1.1;

    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_ssl_server_name on;

    proxy_pass https://agentflow-backend.happyflower-d1c51836.centralindia.azurecontainerapps.io;

    proxy_set_header Host agentflow-backend.happyflower-d1c51836.centralindia.azurecontainerapps.io;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

  location / {
    try_files $uri $uri/ /index.html;
  }
}
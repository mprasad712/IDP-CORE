server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Use k8s DNS resolver. The variable in proxy_pass below makes nginx resolve
  # the backend hostname at request time — not at startup — so nginx starts
  # immediately and serves static files even if the backend DNS is temporarily
  # unresolvable. Without this, nginx blocks on startup until DNS resolves,
  # which is why the browser sees nothing for minutes.
  resolver 127.0.0.11 valid=30s ipv6=off;

  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires -1;
  }

  location = /health {
    set $health_backend "http://agentflow-backend:7860";
    proxy_pass $health_backend/health;
    proxy_set_header Host agentflow-backend;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health_check {
    set $health_backend "http://agentflow-backend:7860";
    proxy_pass $health_backend/health;
    proxy_set_header Host agentflow-backend;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_http_version 1.1;

    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_ssl_server_name on;

    # Variable makes nginx resolve this lazily at request time via the resolver
    # above, not at nginx startup. This is the key fix for the 10-minute cold
    # start: nginx was previously blocked waiting for this DNS lookup to succeed
    # before it could serve any file, including index.html.
    set $api_backend "https://agentflow-backend.happyflower-d1c51836.centralindia.azurecontainerapps.io";
    proxy_pass $api_backend;

    proxy_set_header Host agentflow-backend.happyflower-d1c51836.centralindia.azurecontainerapps.io;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
<!doctype html>
<html lang="en">

<head>
  <base href="/" />
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking font load — doesn't delay first paint -->
  <link
    href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet" />
  </noscript>
  <script src="/config.js"></script>
  <title>Digital Workmate</title>
  <style>
    /* Shown immediately — pure HTML/CSS, zero JS dependency.
         Lives inside #root so React clears it automatically on first render. */
    #pre-app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
    }

    #pre-app-loader .slash {
      fill: #D04A02;
      animation: pre-pulse 1.4s infinite ease-in-out;
    }
    #pre-app-loader .slash-1 { animation-delay: 0s; }
    #pre-app-loader .slash-2 { animation-delay: 0.35s; }

    @keyframes pre-pulse {
      0%   { opacity: 0.35; }
      50%  { opacity: 1; }
      100% { opacity: 0.35; }
    }
  </style>
</head>

<body id="body" class="dark" style="width: 100%; height: 100%">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div style="width: 100vw; height: 100vh" id="root">
    <!--
        Visible the moment the browser parses the HTML — covers the time while
        the JS bundle downloads, MSAL initialises, and React first renders.
        React replaces #root contents on mount, so this disappears automatically.
      -->
    <div id="pre-app-loader">
      <svg width="200" height="90" viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">
        <polygon class="slash slash-1" points="31,69 97,69 104,50 38,50"/>
        <polygon class="slash slash-2" points="103,48 168,48 175,28 109,28"/>
      </svg>
    </div>
  </div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>

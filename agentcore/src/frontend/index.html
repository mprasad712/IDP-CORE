<!doctype html>
<html lang="en">

<head>
  <base href="/" />
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking font load — doesn't delay first paint -->
  <link
    href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet" />
  </noscript>
  <script src="/config.js"></script>
  <title>Digital Workmate</title>
  <style>
    /* Shown immediately — pure HTML/CSS, zero JS dependency.
         Lives inside #root so React clears it automatically on first render. */
    #pre-app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
    }

    #pre-app-loader .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #3f3f46;
      border-top-color: #6366f1;
      animation: pre-spin 0.75s linear infinite;
    }

    @keyframes pre-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body id="body" class="dark" style="width: 100%; height: 100%">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div style="width: 100vw; height: 100vh" id="root">
    <!--
        Visible the moment the browser parses the HTML — covers the time while
        the JS bundle downloads, MSAL initialises, and React first renders.
        React replaces #root contents on mount, so this disappears automatically.
      -->
    <div id="pre-app-loader">
      <div class="spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>

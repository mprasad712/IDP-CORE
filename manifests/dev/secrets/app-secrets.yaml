# IMPORTANT: Do NOT commit real values here.
# Populate this file locally or inject via pipeline using Azure Key Vault.
# Use: kubectl create secret generic app-secrets --from-literal=... -n idpflow
# OR use External Secrets Operator (see manifests/dev/secrets/external-secret.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: idpflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_KV_SECRET"
  REDIS_PASSWORD: "REPLACE_WITH_KV_SECRET"
  STORAGE_ACCOUNT_KEY: "REPLACE_WITH_KV_SECRET"


apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: idpflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres-password"
  DATABASE_URL: "agentcore-shared-postgres-url"
  SMTP_PASSWORD: "smtp-password"
  AZURE_CLIENT_SECRET: "agentcore-azure-client-secret"
  MODEL_SERVICE_ENCRYPTION_KEY: "agentcore-model-service-encryption-key"

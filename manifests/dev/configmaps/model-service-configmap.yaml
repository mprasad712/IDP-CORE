apiVersion: v1
kind: ConfigMap
metadata:
  name: model-service-config
  namespace: idpflow
data:
  ENVIRONMENT: "dev"
  LOG_LEVEL: "INFO"

  MODEL_SERVICE_KEY_VAULT_URL: "https://idpflow-kv-dev-001.vault.azure.net/"

  # PostgreSQL (model metadata store)
  POSTGRES_HOST: "idpflow-postgres.postgres.database.azure.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "idpagentic"
  POSTGRES_USER: "pgadmin"

  # Redis (result cache)
  REDIS_HOST: "idpflow-redis.redis.cache.windows.net"
  REDIS_PORT: "6380"
  REDIS_SSL: "true"

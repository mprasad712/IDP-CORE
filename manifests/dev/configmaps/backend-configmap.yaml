apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: idpflow
data:
  # PostgreSQL
  POSTGRES_HOST: "idpflow-postgres.postgres.database.azure.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "idpflowdb"
  POSTGRES_USER: "pgadmin"

  # Redis
  REDIS_HOST: "idpflow-redis.redis.cache.windows.net"
  REDIS_PORT: "6380"
  REDIS_SSL: "true"

  # Azure Storage
  STORAGE_ACCOUNT_NAME: "idpflowappstore1"
  STORAGE_CONTAINER_NAME: "app-storage-container"

  # Azure Key Vault
  KEY_VAULT_NAME: "idpflow-kv-dev-001"

  # App settings
  ENVIRONMENT: "dev"
  LOG_LEVEL: "INFO"

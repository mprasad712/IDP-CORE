apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: idpflow
data:
  FRONTEND_PORT: "3000"
  NODE_ENV: "production"

  # Backend service URL (K8s internal DNS)
  VITE_API_URL: "http://backend-svc:7860"
  VITE_PROXY_TARGET: "http://backend-svc:7860"
  BACKEND_URL: "http://backend-svc:7860"

  # Update these to your actual public domain after ingress IP is known
  MSAL_REDIRECT_URI: "http://REPLACE_WITH_INGRESS_IP/agents"
  AGENTCORE_PUBLISH_URL: "http://REPLACE_WITH_INGRESS_IP"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: idpflow
  labels:
    app: model-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: model-service-sa
      containers:
        - name: model-service
          image: idpflowacr1.azurecr.io/model-service:62
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: model-service-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
